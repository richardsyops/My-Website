<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Void Walker</title>
    <link rel="stylesheet" href="first.css">
</head>
<body> 
    <div class="one">
        <div>
            <h1 class="kr">VW</h1>
        </div>
        <div class="linkdiv">
           <a href="first.html" target="_blank" class="link">Home</a>
           <a href="about.html" target="_blank" class="link">About</a>
           <a href="product.html" target="_blank" class="link">Product</a>
           <a href="contact.html" target="_self" style="color: wheat;" class="link">Contact</a>
        </div>
        <div class="third">
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer"><img src="/lineicons--linkedin.svg" class="firstimg" alt="LinkedIn"></a>
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer"><img src="/prime--facebook.svg" class="firstimg" alt="Facebook"></a>
            <a href="https://twitter.com" target="_blank" rel="noopener noreferrer"><img src="/si--twitter-fill.svg" class="firstimg" alt="Twitter"></a>
        </div>
    </div>
    <div class="contactwrap">
        <h1>Let's Talk</h1>
        <p>Have a project in mind? Fill this out and I'll get back to you.</p>
        <form class="contactform">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Tell me about your project" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>
    <div class="touch">
        <div>
            <h3>GET IN TOUCH</h3>
            <p>chrisfour@gmail.com</p>
            <p>+2349045589249</p>
        </div>
        <div>
            <a href="contact.html" target="_self"><button>CONTACT ME</button></a>
        </div>
        <div class="third">
            <img src="/lineicons--linkedin.svg" class="firstimg" alt="LinkedIn">
            <img src="/prime--facebook.svg" class="firstimg" alt="Facebook">
            <img src="/si--twitter-fill.svg" class="firstimg" alt="Twitter">
        </div>
    </div>
</body>
</html>
